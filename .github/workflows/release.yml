name: Publish download
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: macos-26
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and verify
        run: zsh build.sh
      - name: Package application
        run: |
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' 'dist/鼠标语音侧键助手.app/Contents/Info.plist')" = '1.1.0'
          mkdir -p release-assets
          ditto -c -k --sequesterRsrc --keepParent 'dist/鼠标语音侧键助手.app' 'release-assets/MouseVoiceButtons-v1.1.0-universal.zip'
          cd release-assets
          shasum -a 256 MouseVoiceButtons-v1.1.0-universal.zip > MouseVoiceButtons-SHA256SUMS.txt
      - name: Publish preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.1.0 \
            release-assets/MouseVoiceButtons-v1.1.0-universal.zip \
            release-assets/MouseVoiceButtons-SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title '鼠标语音侧键助手（Mouse Voice and Side Buttons）v1.1.0' \
            --notes-file RELEASE.md
